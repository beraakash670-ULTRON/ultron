:root{color-scheme:dark;--bg:#0b0708;--panel:#161012;--ink:#f1e9ea;--mute:#a79499;--line:#2a1d20;--accent:#ff2d4a;--accent-ink:#0b0708;--user:#2a1418;--user-ink:#f1e9ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.eye{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:p 2.4s ease-in-out infinite}
@keyframes p{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.eye{animation:none}}
h1{margin:0;font-size:18px;letter-spacing:.3em;font-weight:700}
.st{font-size:11px;letter-spacing:.15em;color:var(--mute)}
header button{margin-left:auto}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:4px 10px;font-size:13px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
#hero{margin:auto;text-align:center;max-width:420px}
#hero[hidden]{display:none}
#hero .w{font-size:clamp(34px,12vw,56px);font-weight:800;letter-spacing:.2em;color:var(--accent);text-shadow:0 0 24px color-mix(in srgb,var(--accent) 45%,transparent)}
#hero p{color:var(--mute);margin:6px 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px}
.chip:active{border-color:var(--accent)}
.m{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.user{align-self:flex-end;background:var(--user);color:var(--user-ink)}
.m.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent)}

    }else{hfStop();cmdMode=false;try{if(wl)wl.release()}catch(e){}wl=null}
  };
  var curBuild=(document.querySelector('meta[name="build"]')||{}).content||"";
  var latest="",dismissed="";
  function checkBuild(j){if(j&&j.build){latest=j.build;if(curBuild&&j.build!==curBuild&&j.build!==dismissed)$("upd").hidden=false}}
  $("ux").onclick=function(){dismissed=latest;$("upd").hidden=true};
  $("ub").onclick=function(){location.replace("/?fresh="+Date.now())};
  var cfg={persona:"villain",lang:"en-IN"};
  try{Object.assign(cfg,JSON.parse(localStorage.getItem("ultron:cfg")||"{}"))}catch(e){}
  function saveCfg(){try{localStorage.setItem("ultron:cfg",JSON.stringify(cfg))}catch(e){}}
  var down=$("down");
  function moreBelow(){
    var far=log.scrollHeight-log.scrollTop-log.clientHeight>220;
    if(far){var top=(tray.childElementCount?tray:$("bar")).getBoundingClientRect().top;down.style.bottom=(innerHeight-top+10)+"px"}
    down.hidden=!far;
  }
  log.addEventListener("scroll",moreBelow);
  down.onclick=function(){log.scrollTo({top:log.scrollHeight,behavior:"smooth"})};
  function syncMenu(){$("m-persona").textContent="Personality: "+(cfg.persona==="plain"?"Plain assistant":"Villain");$("m-lang").textContent="Hands-free language: "+(cfg.lang==="hi-IN"?"Hindi":"English (India)")}
  $("mn").onclick=function(){syncMenu();$("menu").hidden=false};
  $("m-close").onclick=function(){$("menu").hidden=true};
  $("menu").onclick=function(e){if(e.target===this)this.hidden=true};
  $("m-persona").onclick=function(){cfg.persona=cfg.persona==="plain"?"villain":"plain";saveCfg();syncMenu()};
  $("m-lang").onclick=function(){cfg.lang=cfg.lang==="hi-IN"?"en-IN":"hi-IN";saveCfg();syncMenu();if(hfOn){hfStop();resume()}};
  $("m-export").onclick=function(){
    $("menu").hidden=true;
    if(!hist.length){say("Nothing to export yet.");return}
    var txt=hist.map(function(h){return(h.role==="user"?"You":"ULTRON")+": "+(h.content||h.tag||"")}).join("\n\n");
    var u=URL.createObjectURL(new Blob([txt],{type:"text/plain"})),a=document.createElement("a");
    a.href=u;a.download="ultron-chat.txt";document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},4000);
  };
  var vo=$("vo");vo.innerHTML=voiceOn?ICON.vol:ICON.mute;
  vo.onclick=function(){
    voiceOn=!voiceOn;vo.innerHTML=voiceOn?ICON.vol:ICON.mute;
    try{localStorage.setItem("ultron:voice",voiceOn?"on":"off")}catch(e){}
    if(voiceOn)talk("Voice online.");else hush();
  };
  $("vc").onclick=function(){
    var np=voices("a").length,n=np+PRESETS.length;
    vIdx=(vIdx+1)%n;try{localStorage.setItem("ultron:vm",vIdx)}catch(e){}
    var studioMode=vIdx<PRESETS.length;
    stat(studioMode?"STUDIO "+(vIdx+1)+"/"+PRESETS.length:"PHONE VOICE "+(vIdx-PRESETS.length+1)+"/"+np);
    setTimeout(function(){stat(navigator.onLine?"ONLINE":"OFFLINE")},1800);
    talk("Voice "+(vIdx+1)+". Tremble, little human.");
  };
  render();
  var qp=new URLSearchParams(location.search),shared=[qp.get("title"),qp.get("text"),qp.get("url")].filter(Boolean).join("\n");
  if(shared){box.value=shared;grow()}
  if(location.search){try{history.replaceState(null,"",location.pathname)}catch(e){}}
  if(!navigator.onLine)stat("OFFLINE");
  addEventListener("offline",function(){stat("OFFLINE")});
  addEventListener("online",function(){stat("ONLINE");warm()});
  document.addEventListener("visibilitychange",function(){if(document.hidden){hush();hfStop();if(rec)rec.stop()}else{warm();if(hfOn){resume();try{navigator.wakeLock.request("screen").then(function(l){wl=l}).catch(function(){})}catch(e){}}}});
  warm();
})();
</script>
<script>if("serviceWorker"in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script>
</body>
</html>
