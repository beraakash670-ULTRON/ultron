<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>ULTRON</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0708">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f5f2f2;--panel:#fff;--ink:#1a1214;--mute:#6b5b5f;--line:#e2d8da;--accent:#c8102e;--accent-ink:#fff;--user:#1a1214;--user-ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0708;--panel:#161012;--ink:#f1e9ea;--mute:#a08e92;--line:#2a1d20;--accent:#ff2d4a;--accent-ink:#0b0708;--user:#2a1418;--user-ink:#f1e9ea}}
:root[data-theme="dark"]{--bg:#0b0708;--panel:#161012;--ink:#f1e9ea;--mute:#a08e92;--line:#2a1d20;--accent:#ff2d4a;--accent-ink:#0b0708;--user:#2a1418;--user-ink:#f1e9ea}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.eye{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:p 2.4s ease-in-out infinite}
@keyframes p{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.eye{animation:none}}
h1{margin:0;font-size:18px;letter-spacing:.3em;font-weight:700}
.st{font-size:11px;letter-spacing:.15em;color:var(--mute)}
header button{margin-left:auto}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:4px 10px;font-size:13px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
#hero{margin:auto;text-align:center;max-width:420px}
#hero[hidden]{display:none}
#hero .w{font-size:clamp(34px,12vw,56px);font-weight:800;letter-spacing:.2em;color:var(--accent);text-shadow:0 0 24px color-mix(in srgb,var(--accent) 45%,transparent)}
#hero p{color:var(--mute);margin:6px 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px}
.chip:active{border-color:var(--accent)}
.m{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.user{align-self:flex-end;background:var(--user);color:var(--user-ink)}
.m.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent)}
.m.think{color:var(--mute);font-style:italic}
.m.err{color:var(--accent)}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--bg)}
textarea{flex:1;resize:none;font:16px/1.4 inherit;font-family:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-height:140px;outline:none}
textarea:focus{border-color:var(--accent)}
#go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:0 18px;font-weight:700;letter-spacing:.08em}
#go:disabled{opacity:.5}

#tray{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 0;border-top:1px solid var(--line);background:var(--bg)}
#tray:empty{display:none}
.chip2{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:4px 6px;font-size:13px;color:var(--mute)}
.chip2 img{width:44px;height:44px;object-fit:cover;border-radius:6px;display:block}
.chip2 button{background:none;border:0;color:var(--accent);font-size:16px;padding:0 4px}
#bar{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--bg)}
#tray:not(:empty)+#bar{border-top:0}
.ib{flex:none;width:44px;height:44px;font-size:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0}
.ib.rec{border-color:var(--accent);animation:p 1s ease-in-out infinite}
#go{height:44px}
.m audio{display:block;max-width:100%;margin-bottom:6px}
.m .th{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.m .th img{width:96px;height:96px;object-fit:cover;border-radius:8px}
.m .tg{font-size:13px;opacity:.7}


button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#log{overscroll-behavior:contain}
.ib.rec{width:auto;padding:0 12px;font-size:14px}
.m pre{background:color-mix(in srgb,var(--ink) 9%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:pre;margin:6px 0;font-size:13px}
.m code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.m :not(pre)>code{background:color-mix(in srgb,var(--ink) 12%,transparent);padding:1px 5px;border-radius:5px}
.li{padding-left:1.2em;text-indent:-1.2em}
.cp{display:block;margin-top:6px;background:none;border:0;color:var(--mute);font-size:13px;padding:2px 0}
.m.err .cp{color:var(--accent)}
#lock{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
#lock[hidden]{display:none}
.lk{width:100%;max-width:340px;text-align:center}
.lk .w{font-size:40px;font-weight:800;letter-spacing:.2em;color:var(--accent)}
.lk p{color:var(--mute);margin:6px 0 16px}
#lc{width:100%;box-sizing:border-box;font-size:16px;text-align:center;letter-spacing:.15em;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}
#lc:focus{border-color:var(--accent)}
#le{min-height:22px;color:var(--accent);font-size:14px;margin:8px 0}
#lb{width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px;font-weight:700;letter-spacing:.08em}
#lx{background:none;border:0;color:var(--mute);margin-top:10px;font-size:14px}
.face{display:block;width:min(58vw,230px);aspect-ratio:3/4;object-fit:cover;border-radius:18px;margin:0 auto 14px;border:1px solid var(--line);box-shadow:0 0 40px color-mix(in srgb,var(--accent) 40%,transparent)}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:50% 25%;border:2px solid var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 60%,transparent)}
.face[hidden],.av[hidden]{display:none}
.hb{margin-left:auto;display:flex;gap:6px}
.hb button{margin-left:0;padding:4px 9px}
.row{display:flex;gap:16px}
@media(max-width:400px){h1{letter-spacing:.18em;font-size:16px}.st{display:none}}
</style>
</head>
<body>
<div id="lock" hidden><div class="lk"><div class="w">ULTRON</div><p>Enter your access code</p><input id="lc" type="password" autocomplete="off" aria-label="Access code"><div id="le"></div><button id="lb" type="button">UNLOCK</button><button id="lx" type="button">Not now</button></div></div>
<header>
  <div class="eye"></div>
  <img id="ha" class="av" hidden alt="">
  <h1>ULTRON</h1>
  <span class="st" id="st">ONLINE</span>
  <div class="hb"><button class="ghost" id="vo" type="button" aria-label="Voice on or off">🔊</button><button class="ghost" id="vc" type="button" aria-label="Change voice">🎙</button><button class="ghost" id="clr" type="button">Clear</button></div>
</header>
<div id="log">
  <div id="hero">
    <img id="hf" class="face" hidden alt="">
    <div class="w">ULTRON</div>
    <p>Type, speak with 🎤, or show me photos and videos with 📎.</p>
    <div class="chips" id="chips"></div>
  </div>
</div>
<div id="tray"></div>
<div id="bar">
  <button class="ib" id="att" type="button" aria-label="Attach photo or video">📎</button>
  <button class="ib" id="mic" type="button" aria-label="Record voice message">🎤</button>
  <textarea id="box" rows="1" placeholder="Command ULTRON…" aria-label="Message"></textarea>
  <button id="go" type="button">SEND</button>
</div>
<input type="file" id="file" accept="image/*,video/*" multiple hidden>
<script>
(function(){
  var KEY="ultron:chat",CK="ultron:code",code="";
  try{code=localStorage.getItem(CK)||""}catch(e){}
  var IDEAS=["Explain black holes simply","Plan my week for focus","Write a Python script to rename files","Give me a bold startup idea"];
  var $=function(i){return document.getElementById(i)};
  var log=$("log"),hero=$("hero"),box=$("box"),go=$("go"),tray=$("tray"),mic=$("mic"),file=$("file");
  var hist=[],busy=false,pending=[],rec=null,ts=0,mt=0,cc=0,touch=matchMedia("(pointer:coarse)").matches;
  try{hist=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){hist=[]}
  if(!Array.isArray(hist))hist=[];
  function save(){try{localStorage.setItem(KEY,JSON.stringify(hist.slice(-40).map(function(h){return{role:h.role,content:h.content,tag:h.tag}})))}catch(e){}}
  function add(role,text,tag,ui){
    var d=document.createElement("div");d.className="m "+role;
    if(ui&&ui.length){
      var th=document.createElement("div");th.className="th";
      ui.forEach(function(u){
        if(u.k==="a"){var a=document.createElement("audio");a.controls=true;a.src=u.u;d.appendChild(a)}
        else{var im=document.createElement("img");im.src=u.u;th.appendChild(im)}
      });
      if(th.children.length)d.insertBefore(th,d.firstChild);
    }else if(tag){var t=document.createElement("div");t.className="tg";t.textContent=tag;d.appendChild(t)}
    var s=document.createElement("div");s.className="tx";s.textContent=text;d.appendChild(s);
    log.appendChild(d);log.scrollTop=log.scrollHeight;return d;
  }
  function say(t){add("bot",t).classList.add("err")}
  function grow(){box.style.height="auto";box.style.height=Math.min(box.scrollHeight,140)+"px"}
  function render(){
    Array.prototype.slice.call(log.querySelectorAll(".m")).forEach(function(n){n.remove()});
    hist.forEach(function(h){var d=add(h.role==="user"?"user":"bot",h.content,h.tag);if(h.role!=="user")fill(d,h.content)});
    hero.hidden=hist.length>0;
  }
  function b64(blob){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(String(r.result).split(",")[1])};r.onerror=no;r.readAsDataURL(blob)})}
  function jpeg(src,w,h,max,q){
    var s=Math.min(1,max/Math.max(w,h)),c=document.createElement("canvas");
    c.width=Math.round(w*s);c.height=Math.round(h*s);
    c.getContext("2d").drawImage(src,0,0,c.width,c.height);
    return new Promise(function(ok){c.toBlob(ok,"image/jpeg",q)});
  }
  async function doImage(f){
    var bm=await createImageBitmap(f),b=await jpeg(bm,bm.width,bm.height,1280,.82);
    return{k:"i",label:"Photo",mime:"image/jpeg",data:[await b64(b)],url:URL.createObjectURL(b)};
  }
  async function doVideo(f){
    var u=URL.createObjectURL(f),v=document.createElement("video");
    v.muted=true;v.playsInline=true;v.preload="auto";v.src=u;
    await new Promise(function(ok,no){v.onloadeddata=ok;v.onerror=no});
    var n=6,fr=[],th=null,d=v.duration||1;
    for(var i=0;i<n;i++){
      v.currentTime=Math.min(d-.05,d*(i+.5)/n);
      await new Promise(function(ok){v.onseeked=ok});
      var b=await jpeg(v,v.videoWidth,v.videoHeight,640,.7);
      if(!th)th=URL.createObjectURL(b);
      fr.push(await b64(b));
    }
    URL.revokeObjectURL(u);
    return{k:"v",label:"Video",mime:"image/jpeg",data:fr,url:th,note:"The "+n+" attached images are frames sampled evenly in time from one video the user shared. Describe what happens in it."};
  }
  async function toWav(blob){
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    var buf=await ctx.decodeAudioData(await blob.arrayBuffer());ctx.close();
    var rate=16000,len=Math.ceil(buf.duration*rate),off=new OfflineAudioContext(1,len,rate),src=off.createBufferSource();
    src.buffer=buf;src.connect(off.destination);src.start();
    var pcm=(await off.startRendering()).getChannelData(0),o=new DataView(new ArrayBuffer(44+len*2));
    function w(p,s){for(var i=0;i<s.length;i++)o.setUint8(p+i,s.charCodeAt(i))}
    w(0,"RIFF");o.setUint32(4,36+len*2,true);w(8,"WAVE");w(12,"fmt ");o.setUint32(16,16,true);o.setUint16(20,1,true);o.setUint16(22,1,true);
    o.setUint32(24,rate,true);o.setUint32(28,rate*2,true);o.setUint16(32,2,true);o.setUint16(34,16,true);w(36,"data");o.setUint32(40,len*2,true);
    for(var i=0;i<len;i++){var s=Math.max(-1,Math.min(1,pcm[i]));o.setInt16(44+i*2,s<0?s*32768:s*32767,true)}
    return new Blob([o],{type:"audio/wav"});
  }
  function draw(){
    tray.textContent="";
    pending.forEach(function(p,i){
      var c=document.createElement("div");c.className="chip2";
      if(p.k!=="a"&&p.url){var im=document.createElement("img");im.src=p.url;c.appendChild(im)}
      var t=document.createElement("span");t.textContent=p.label;c.appendChild(t);
      var x=document.createElement("button");x.type="button";x.textContent="✕";x.setAttribute("aria-label","Remove");
      x.onclick=function(){pending.splice(i,1);draw()};c.appendChild(x);tray.appendChild(c);
    });
  }
  $("att").onclick=function(){file.click()};
  file.onchange=async function(){
    var fs=Array.prototype.slice.call(file.files);file.value="";
    for(var j=0;j<fs.length;j++){
      if(pending.length>=4){say("Up to 4 attachments per message.");break}
      try{pending.push(fs[j].type.indexOf("video")===0?await doVideo(fs[j]):await doImage(fs[j]));draw()}
      catch(e){say("Couldn’t read that file. Try a different one.")}
    }
  };
  mic.onclick=async function(){
    hush();if(rec){rec.stop();return}
    if(!navigator.mediaDevices||!window.MediaRecorder){say("Recording isn’t supported in this browser.");return}
    try{
      var st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[],mr=new MediaRecorder(st),t0=Date.now();
      mr.ondataavailable=function(e){if(e.data.size)ch.push(e.data)};
      mr.onstop=async function(){
        st.getTracks().forEach(function(t){t.stop()});clearTimeout(ts);clearInterval(mt);mic.textContent="🎤";rec=null;mic.classList.remove("rec");
        var sec=Math.round((Date.now()-t0)/1000);
        try{
          var wav=await toWav(new Blob(ch,{type:mr.mimeType}));
          pending=pending.filter(function(p){return p.k!=="a"});
          pending.push({k:"a",label:"Voice "+Math.floor(sec/60)+":"+("0"+sec%60).slice(-2),mime:"audio/wav",data:[await b64(wav)],url:URL.createObjectURL(wav)});
          draw();
        }catch(e){say("Couldn’t process that recording. Try again.")}
      };
      mr.start();rec=mr;mic.classList.add("rec");var s0=Date.now();mic.textContent="⏹ 0:00";mt=setInterval(function(){var s=Math.round((Date.now()-s0)/1000);mic.textContent="⏹ "+Math.floor(s/60)+":"+("0"+s%60).slice(-2)},500);
      ts=setTimeout(function(){if(rec)rec.stop()},60000);
    }catch(e){say("Microphone access was blocked. Allow it in Chrome’s site settings and try again.")}
  };
  var voiceOn=true,vIdx=0,gen=0,cur=null,actx=null,warned=false;
  try{voiceOn=localStorage.getItem("ultron:voice")!=="off";vIdx=+localStorage.getItem("ultron:vm")||0}catch(e){}
  try{speechSynthesis.getVoices()}catch(e){}
  function hush(){gen++;try{speechSynthesis.cancel()}catch(e){}if(cur){try{cur.stop()}catch(e){}cur=null}}
  function voices(s){
    var l=/[\u0900-\u097F]/.test(s)?"hi":"en";
    try{return speechSynthesis.getVoices().filter(function(v){return v.lang.toLowerCase().replace("_","-").indexOf(l)===0})}catch(e){return[]}
  }
  function clean(t){return t.replace(/```[\s\S]*?```/g," Code omitted. ").replace(/https?:\/\/\S+/g," link ").replace(/[*_`#>•]/g,"").replace(/\s+/g," ").trim()}
  // Studio voice: Gemini speech from the server, then a robotic colour added with Web Audio.
  async function studio(s,g){
    var r=await fetch("/speak",{method:"POST",headers:{"Content-Type":"application/json","x-app-token":code},body:JSON.stringify({text:s})});
    if(!r.ok){var j=await r.json().catch(function(){return{}});throw new Error(String(j.error||"HTTP "+r.status).slice(0,110))}
    var raw=await r.arrayBuffer();
    if(g!==gen)return;
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")await actx.resume();
    var buf=await actx.decodeAudioData(raw);
    if(g!==gen)return;
    var src=actx.createBufferSource();src.buffer=buf;src.playbackRate.value=.93;
    var out=actx.createGain(),dry=actx.createGain(),ring=actx.createGain(),wet=actx.createGain(),osc=actx.createOscillator(),dl=actx.createDelay(.1),fb=actx.createGain(),echo=actx.createGain();
    dry.gain.value=.85;ring.gain.value=0;wet.gain.value=.22;osc.frequency.value=55;dl.delayTime.value=.028;fb.gain.value=.35;echo.gain.value=.25;
    osc.connect(ring.gain);
    src.connect(dry);src.connect(ring);ring.connect(wet);
    dry.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(echo);
    dry.connect(out);wet.connect(out);echo.connect(out);out.connect(actx.destination);
    cur=src;osc.start();
    await new Promise(function(ok){src.onended=ok;src.start()});
    try{osc.stop()}catch(e){}
    if(cur===src)cur=null;
  }
  function phone(s){
    var vs=voices(s),v=vs.length?vs[(vIdx>0?vIdx-1:0)%vs.length]:null,parts=[],cur2="";
    (s.match(/[^.!?।]+[.!?।]*\s*/g)||[s]).forEach(function(x){if(cur2&&(cur2+x).length>180){parts.push(cur2);cur2=x}else cur2+=x});
    if(cur2)parts.push(cur2);
    parts=parts.reduce(function(o,p){while(p.length>220){var i=p.lastIndexOf(" ",200);if(i<50)i=200;o.push(p.slice(0,i));p=p.slice(i)}o.push(p);return o},[]);
    setTimeout(function(){
      parts.forEach(function(p){
        var u=new SpeechSynthesisUtterance(p);
        if(v){u.voice=v;u.lang=v.lang}else u.lang=/[\u0900-\u097F]/.test(s)?"hi-IN":"en-US";
        u.pitch=.5;u.rate=.9;speechSynthesis.speak(u);
      });
    },80);
  }
  function talk(text){
    var s=clean(text);if(!s)return;
    hush();var g=gen;
    if(vIdx===0){
      var sh=s.length>700?(s.slice(0,700).replace(/[^.!?।]*$/,"")||s.slice(0,700)):s;
      studio(sh,g).catch(function(e){
        if(!warned){warned=true;add("bot","Studio voice unavailable: "+(e&&e.message||"unknown error")+". Using the phone voice instead.").classList.add("err")}
        if(g===gen&&window.speechSynthesis)phone(s);
      });
    }else if(window.speechSynthesis)phone(s);
  }
  function stat(s){$("st").textContent=s}
  function inl(p,s){
    s.split(/(\*\*[^*]+\*\*|`[^`]+`)/).forEach(function(x){
      var n;
      if(/^\*\*[^*]+\*\*$/.test(x)){n=document.createElement("strong");n.textContent=x.slice(2,-2)}
      else if(/^`[^`]+`$/.test(x)){n=document.createElement("code");n.textContent=x.slice(1,-1)}
      else n=document.createTextNode(x);
      p.appendChild(n);
    });
  }
  function md(el,s){
    s.split("```").forEach(function(seg,i){
      if(i%2){var pre=document.createElement("pre"),c=document.createElement("code");c.textContent=seg.replace(/^[^\n]*\n/,"").replace(/\n+$/,"");pre.appendChild(c);el.appendChild(pre);return}
      var prev=false;
      seg.replace(/^\n+|\n+$/g,"").split("\n").forEach(function(line){
        var m=/^\s*([-*•]|\d+\.)\s+(.*)$/.exec(line);
        if(m){var li=document.createElement("div");li.className="li";inl(li,(/\d/.test(m[1])?m[1]:"•")+" "+m[2]);el.appendChild(li);prev=false}
        else{if(prev)el.appendChild(document.createTextNode("\n"));inl(el,line);prev=true}
      });
    });
  }
  function fill(d,s){
    var tx=d.querySelector(".tx");tx.textContent="";md(tx,s);
    var b=document.createElement("button");b.type="button";b.className="cp";b.textContent="Copy";
    b.onclick=function(){
      (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(function(){b.textContent="Copied ✓"},function(){b.textContent="Press and hold the text to copy"});
      setTimeout(function(){b.textContent="Copy"},1800);
    };
    var sp=document.createElement("button");sp.type="button";sp.className="cp";sp.textContent="🔊 Speak";
    sp.onclick=function(){talk(s)};
    var row=document.createElement("div");row.className="row";row.appendChild(b);row.appendChild(sp);d.appendChild(row);
  }
  function needCode(msg){
    return new Promise(function(ok){
      var l=$("lock"),i=$("lc");
      $("le").textContent=msg||"";i.value="";l.hidden=false;setTimeout(function(){i.focus()},50);
      function done(v){l.hidden=true;ok(v)}
      $("lb").onclick=function(){var v=i.value.trim();if(v)done(v)};
      $("lx").onclick=function(){done(null)};
      i.onkeydown=function(e){if(e.key==="Enter")$("lb").onclick()};
    });
  }
  async function unlock(msg){
    var v=await needCode(msg);
    if(v===null)return false;
    code=v;try{localStorage.setItem(CK,code)}catch(e){}
    var j=await fetch("/ping",{headers:{"x-app-token":code},cache:"no-store"}).then(function(r){return r.json()}).catch(function(){return{auth:true}});
    if(j.auth===false)return unlock("Wrong code. Try again.");face();return true;
  }
  function face(){
    if(!$("ha").hidden)return Promise.resolve();
    return fetch("/face.jpg",{headers:{"x-app-token":code}}).then(function(r){return r.ok?r.blob():null}).then(function(b){
      if(!b)return;var u=URL.createObjectURL(b);
      ["hf","ha"].forEach(function(i){var im=$(i);im.src=u;im.hidden=false});
      document.querySelector(".eye").hidden=true;
    }).catch(function(){});
  }
  function warm(){
    return fetch("/ping",{headers:{"x-app-token":code},cache:"no-store"}).then(function(r){return r.json()}).then(function(j){return j&&j.auth===false?unlock(""):face()}).catch(function(){});
  }
  async function send(msgs,onWake){
    for(var n=0;n<2;n++){
      var ac=new AbortController(),to=setTimeout(function(){ac.abort()},75000);
      try{
        var r=await fetch("/chat",{method:"POST",signal:ac.signal,headers:{"Content-Type":"application/json","x-app-token":code},body:JSON.stringify({messages:msgs})});
        clearTimeout(to);
        if(n||r.status<502||r.status>504)return r;
      }catch(e){clearTimeout(to);if(n)throw e}
      onWake();
      await new Promise(function(ok){setTimeout(ok,3000)});
    }
  }
  async function ask(text){
    text=(text||"").trim();
    if((!text&&!pending.length)||busy||rec)return;
    hush();busy=true;go.disabled=true;box.value="";grow();hero.hidden=true;stat("WORKING");
    var att=pending;pending=[];draw();
    var media=[],notes=[],tags=[],ui=[],hasA=false;
    att.forEach(function(p){
      p.data.forEach(function(d){media.push({mime:p.mime,data:d})});
      if(p.note)notes.push(p.note);
      tags.push(p.k==="a"?"🎤 Voice message":p.k==="v"?"🎞️ Video":"📷 Photo");
      ui.push({k:p.k==="a"?"a":"i",u:p.url});
      if(p.k==="a")hasA=true;
    });
    var sent=text;
    if(hasA)sent="The user sent a voice message. Begin your reply with “You said: ” and an accurate transcript in the original language, then answer it."+(text?" The user also typed: "+text:"");
    else if(!text)sent="What do you see? Describe it and point out anything notable.";
    if(notes.length)sent+="\n\n"+notes.join(" ");
    var item={role:"user",content:text,tag:tags.join(" · "),ask:sent,media:media.length?media:null};
    if(item.media)hist.forEach(function(h){h.media=null});
    hist.push(item);
    var ub=add("user",text,item.tag,ui);
    var el=add("bot","Thinking"),base="Thinking",dots=0;
    var tk=setInterval(function(){el.querySelector(".tx").textContent=base+".".repeat(dots=(dots+1)%4)},400);
    el.classList.add("think");
    try{
      var last=-1;hist.forEach(function(h,i){if(h.media)last=i});
      var msgs=hist.map(function(h,i){
        var m={role:h.role,content:(h.ask||h.content||h.tag||"(attachment)")+(h.tag&&!h.media&&h.role==="user"?" [earlier attachment not included]":"")};
        if(h.media&&i===last)m.media=h.media;
        return m;
      }).slice(-20);
      while(msgs.length&&msgs[0].role!=="user")msgs.shift();
      var res=await send(msgs,function(){base="Waking the server, this can take up to a minute"});
      if(res.status===401&&await unlock(code?"Wrong code. Try again.":""))res=await send(msgs,function(){});
      if(!res.ok){
        var j0=await res.json().catch(function(){return{}});
        var er=new Error("http");er.code=res.status===429?"rate_limited":res.status===401?"auth":res.status===413?"big":"http";er.detail=j0.error;throw er;
      }
      var r=await res.json(),out=r.text||"…";
      clearInterval(tk);el.classList.remove("think");fill(el,out);if(voiceOn)talk(out);
      if(el.offsetHeight>log.clientHeight*.8)el.scrollIntoView({block:"start"});else log.scrollTop=log.scrollHeight;
      hist.push({role:"assistant",content:out});save();
    }catch(e){
      clearInterval(tk);el.classList.remove("think");el.classList.add("err");
      var msg=e&&e.code==="rate_limited"?"Too many requests, or the free AI limit is used up. Wait a minute and try again.":e&&e.code==="auth"?"An access code is needed. Tap Retry to enter it.":e&&e.code==="big"?"That is too much to send at once. Try fewer or shorter attachments.":!navigator.onLine?"You’re offline. Check your connection.":"ULTRON’s server didn’t respond. It may be waking up, so try again in a minute.";
      if(e&&e.detail)msg+="\n("+String(e.detail).slice(0,120)+")";
      el.querySelector(".tx").textContent=msg;
      var rb=document.createElement("button");rb.type="button";rb.className="cp";rb.textContent="↻ Retry";
      rb.onclick=function(){if(busy)return;ub.remove();el.remove();pending=att;ask(text)};
      el.appendChild(rb);
      hist.pop();
    }finally{clearInterval(tk);busy=false;go.disabled=false;stat(navigator.onLine?"ONLINE":"OFFLINE")}
  }
  IDEAS.forEach(function(t){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=t;b.onclick=function(){ask(t)};$("chips").appendChild(b)});
  go.onclick=function(){ask(box.value)};
  box.addEventListener("input",grow);
  box.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&!touch){e.preventDefault();ask(box.value)}});
  $("clr").onclick=function(){
    if(busy||rec||!hist.length)return;
    var b=$("clr");
    if(!cc){b.textContent="Tap to confirm";cc=setTimeout(function(){cc=0;b.textContent="Clear"},3000);return}
    clearTimeout(cc);cc=0;b.textContent="Clear";hush();hist=[];pending=[];draw();save();render();
  };
  var vo=$("vo");vo.textContent=voiceOn?"🔊":"🔇";
  vo.onclick=function(){
    voiceOn=!voiceOn;vo.textContent=voiceOn?"🔊":"🔇";
    try{localStorage.setItem("ultron:voice",voiceOn?"on":"off")}catch(e){}
    if(voiceOn)talk("Voice online.");else hush();
  };
  $("vc").onclick=function(){
    var n=voices("a").length+1;
    vIdx=(vIdx+1)%n;try{localStorage.setItem("ultron:vm",vIdx)}catch(e){}
    stat(vIdx?"PHONE VOICE "+vIdx+"/"+(n-1):"STUDIO VOICE");
    setTimeout(function(){stat(navigator.onLine?"ONLINE":"OFFLINE")},1800);
    talk("Ultron online. Is this voice acceptable?");
  };
  render();
  if(!navigator.onLine)stat("OFFLINE");
  addEventListener("offline",function(){stat("OFFLINE")});
  addEventListener("online",function(){stat("ONLINE");warm()});
  document.addEventListener("visibilitychange",function(){if(document.hidden){hush();if(rec)rec.stop()}else warm()});
  warm();
})();
</script>
<script>if("serviceWorker"in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script>
